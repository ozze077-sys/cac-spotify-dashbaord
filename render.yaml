# Render blueprint: hosts the Dash dashboard as a free web service (https://render.com).
services:
  - type: web
    name: spotify-unit-economics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir dashboards dashboard:server --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
