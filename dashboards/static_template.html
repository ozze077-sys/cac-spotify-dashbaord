<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Unit Economics</title>
<meta name="description" content="Interactive Spotify unit economics dashboard (FY2021-FY2025, US dollars): revenue, subscribers, ARPU, profitability, CAC, LTV, retention, sensitivity and Monte Carlo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
:root {
  --green: #1db954; --green-dark: #148a3e; --black: #121212; --grey: #9e9e9e;
  --ink: #14171c; --ink-2: #4b5058; --ink-3: #8a8f98; --border: #e8e8e8; --page: #f7f7f7; --card: #ffffff;
  --soft: #effaf3;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Plus Jakarta Sans', Inter, 'Segoe UI', sans-serif; background: var(--page); color: var(--ink);
  -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.app { display: flex; min-height: 100vh; }

/* sidebar */
.side { width: 264px; flex-shrink: 0; color: #e8eaed; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: linear-gradient(180deg, #050505 0%, #06120b 55%, #0b2415 100%); }
.brand { display: flex; align-items: center; gap: 12px; padding: 24px 22px 12px; }
.logo { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--green), var(--green-dark)); box-shadow: 0 8px 24px rgba(29,185,84,.45); }
.brand b { font-size: 22px; letter-spacing: -.02em; display: block; line-height: 1.05; }
.brand small { font-size: 11.5px; color: #8fa397; }
.badge { margin: 4px 16px 16px; padding: 10px 12px; border-radius: 12px; text-align: center; color: #04110a;
  background: linear-gradient(120deg, var(--green), #7ee2a8); box-shadow: 0 8px 26px rgba(29,185,84,.4); }
.badge b { display: block; font-size: 14px; letter-spacing: .14em; }
.badge span { font-size: 10.5px; font-weight: 600; color: #0b3a1d; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 3px 12px; border-radius: 12px;
  color: #b9c4bd; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid transparent;
  transition: background .15s, color .15s; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.on { color: #fff; background: linear-gradient(90deg, rgba(29,185,84,.30), rgba(29,185,84,.08));
  border-color: rgba(29,185,84,.4); box-shadow: 0 8px 24px rgba(29,185,84,.18); }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.quick { margin: 18px 14px 20px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08); font-size: 13px; }
.quick h4 { margin: 0 0 4px; color: #fff; font-size: 15px; }
.quick p { margin: 0 0 10px; color: #a9b4ad; font-size: 12px; line-height: 1.5; }
.quick .row2 { display: flex; justify-content: space-between; color: #d6ded9; margin-top: 4px; }
.verdict { margin-top: 10px; text-align: center; border-radius: 999px; padding: 6px 0; font-weight: 700; font-size: 12.5px; }
.verdict.good { color: #04110a; background: linear-gradient(90deg, var(--green), #7ee2a8); }
.verdict.bad { color: #fff; background: linear-gradient(90deg, #3a3a3a, #555); }

/* top bar */
.main { flex: 1; min-width: 0; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 14px 32px; color: #fff;
  background: linear-gradient(100deg, #050505 0%, #07160d 45%, #0d2c19 75%, #14532d 100%); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.top h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.top .left { display: flex; align-items: center; gap: 14px; }
.burger { display: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
  background: transparent; color: #fff; font-size: 18px; cursor: pointer; }
.filters { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; }
.filters b { color: #7ee2a8; }
.filters select { font: inherit; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #0e1a13;
  color: #fff; padding: 5px 8px; }
.content { padding: 22px 32px 32px; max-width: 1480px; }
.source { font-size: 12px; color: var(--ink-3); margin-top: 10px; }

/* building blocks */
.explain { background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--green); border-radius: 14px;
  padding: 14px 18px; margin-bottom: 16px; }
.explain .k { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--green-dark); text-transform: uppercase; }
.explain .h { font-size: 15.5px; font-weight: 600; margin: 4px 0; }
.explain .r { font-size: 13px; color: var(--ink-2); }
.grid { display: grid; gap: 14px; margin-bottom: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
  box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05); min-width: 0; }
.card .l { font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.card .v { font-size: 25px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
.pill { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  background: #f0f1f4; color: var(--ink-2); }
.pill.up { background: #e8f7ee; color: var(--green-dark); }
.pill.down { background: var(--black); color: #fff; }
.row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.row > * { flex: 1 1 420px; min-width: 0; }
.panel { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 12px;
  box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05); }
.panel h3 { margin: 6px 8px 10px; font-size: 15px; }
.chart { width: 100%; height: 360px; }
.note { font-size: 12px; color: var(--ink-3); line-height: 1.5; padding: 4px 10px 6px; }
.callout { border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.55; border-left: 4px solid var(--green);
  background: var(--soft); color: var(--ink-2); flex: 1 1 280px; }
.callout b { display: block; color: var(--ink); margin-bottom: 4px; }
.callout.warn { background: #f2f2f2; border-color: var(--black); }
.section { margin: 26px 0 14px; }
.section h2 { margin: 0; font-size: 21px; }
.section p { margin: 2px 0 0; font-size: 13.5px; color: #6b7079; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: right; font-size: 12px; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--border); }
table.t th:first-child, table.t td:first-child { text-align: left; font-weight: 600; }
table.t.wrap td { white-space: normal; }
.tablewrap { overflow-x: auto; }
.heat { border-collapse: collapse; width: 100%; font-size: 13px; }
.heat th { position: sticky; top: 0; background: #fff; font-size: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
.heat td { padding: 9px 10px; text-align: center; white-space: nowrap; }
.heat td:first-child { text-align: left; font-weight: 700; background: #fff; border-bottom: 1px solid var(--border); }
.heat tr.sel td { font-weight: 800; }
.heat td.mark { box-shadow: inset 0 0 0 2px #14171c; font-weight: 800; }
.toolbar { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 4px 4px 12px; }
select.s { font: inherit; font-size: 13px; border: 1px solid #e9ebef; border-radius: 8px; padding: 7px 10px; background: #fff; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 10px 4px 2px; }
.legend i { width: 160px; height: 10px; border-radius: 5px; display: inline-block; }

/* controls */
.ctl { margin-bottom: 16px; }
.ctl .lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.ctl .lab span { color: var(--green-dark); }
.ctl .help { font-size: 12px; color: var(--ink-3); margin: 2px 0 6px; }
input[type=range] { width: 100%; accent-color: var(--green); }
.side input[type=range] { accent-color: var(--green); }
.split { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.split > .controls { flex: 0 0 320px; }
.split > .out { flex: 1 1 600px; min-width: 0; }
.btn { font: inherit; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 9px 16px; cursor: pointer;
  border: 1px solid var(--border); background: #fff; }
.assume { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.assume .card p { font-size: 13px; color: #55595f; line-height: 1.55; margin: 8px 0 0; }
.assume .card p b { color: var(--black); }

/* hero */
.hero { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; border-radius: 22px; padding: 28px 34px; color: #fff;
  background: radial-gradient(circle at 85% 15%, rgba(29,185,84,.40) 0%, rgba(29,185,84,0) 42%),
              radial-gradient(circle at 10% 110%, rgba(29,185,84,.22) 0%, rgba(29,185,84,0) 40%),
              linear-gradient(130deg, #050505 0%, #0a1d12 50%, #14532d 100%);
  box-shadow: 0 24px 60px rgba(5,20,12,.28); }
.hero .txt { flex: 1 1 480px; min-width: 0; }
.hero .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .16em; border-radius: 999px;
  padding: 6px 14px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.05); }
.hero h2 { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; margin: 14px 0 10px; }
.hero h2 em { font-style: normal; background: linear-gradient(90deg, var(--green), #9ff0c0); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
.hero p { font-size: 14.5px; color: #cfdad3; line-height: 1.55; max-width: 640px; margin: 0; }
.hero .ctas { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.hero .ctas a { border-radius: 999px; padding: 10px 20px; font-size: 13.5px; font-weight: 700; text-decoration: none; }
.hero .ctas a.w { background: #fff; color: var(--black); }
.hero .ctas a.o { color: #fff; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.05); }
.floats { display: flex; flex-direction: column; }
.f1 { width: 180px; border-radius: 16px; padding: 14px 18px; border: 1px solid rgba(255,255,255,.22);
  background: linear-gradient(145deg, rgba(29,185,84,.55), rgba(20,83,45,.85)); box-shadow: 0 20px 40px rgba(0,0,0,.35); }
.f2 { width: 170px; border-radius: 16px; padding: 14px 18px; background: #fff; color: var(--black); margin: 10px 0 0 50px;
  box-shadow: 0 24px 48px rgba(0,0,0,.35); }
.f1 small, .f2 small { font-size: 12.5px; color: #cfe9d9; }
.f2 small { color: #6b7079; }
.f1 b, .f2 b { display: block; font-size: 26px; margin: 4px 0; }
.f2 b { color: var(--green-dark); }
.steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.step { display: flex; gap: 14px; }
.step .n { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--soft); color: var(--green-dark);
  font-weight: 800; display: flex; align-items: center; justify-content: center; }
.step h4 { margin: 4px 0 6px; font-size: 16px; }
.step p { margin: 0; font-size: 13.5px; color: #55595f; line-height: 1.55; }

@media (max-width: 900px) {
  .side { position: fixed; left: -280px; z-index: 30; transition: left .2s; }
  .side.open { left: 0; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  .burger { display: inline-block; }
  .top { padding: 12px 16px; } .top h1 { font-size: 20px; }
  .content { padding: 16px; }
  .split > .controls { flex: 1 1 100%; }
  .f2 { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
      <div><b>Spotify</b><small>Financial Analysis</small></div>
    </div>
    <div class="badge"><b>UNIT ECONOMICS</b><span>LTV · CAC · ARPU · Churn · Payback</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="quick">
      <h4>Churn Scenario</h4>
      <p>Adjust the monthly churn rate. LTV, CAC payback and LTV:CAC update live.</p>
      <div class="row2"><span>Monthly churn</span><b id="q-churn"></b></div>
      <input type="range" id="side-churn" min="1" max="8" step="0.5">
      <div id="q-out"></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="left"><button class="burger" id="burger" aria-label="Menu">☰</button><h1 id="title"></h1></div>
      <div class="filters"><b>USD $</b><span>Year</span>
        <select id="year"><option value="all">All years (2021–2025)</option></select></div>
    </header>
    <main class="content">
      <div id="view"></div>
      <div class="source" id="source"></div>
    </main>
  </div>
</div>
<script>
const DATA = __DATA__;
const C = { green: '#1db954', greenDark: '#148a3e', black: '#121212', grey: '#9e9e9e', ink2: '#52514e' };
const FONT = "'Plus Jakarta Sans', Inter, 'Segoe UI', sans-serif";
const A = DATA.annual, Q = DATA.quarterly, UE = DATA.ue_by_year;
const YEARS = A.map(r => r.year);
const BASE = Object.fromEntries(DATA.base_inputs.map(r => [r.year, r]));
const DEFAULTS = { churn: 3, arpu: 0, gm: 0, sm: 0, na: 0, proxy: 'gross', baseYear: DATA.default_base_year };
const MC_DEFAULTS = { lo: 2, hi: 5, arpu: 10, gm: 2, sm: 20, na: 25, runs: 10000 };
const state = { page: 'overview', year: 'all', ...DEFAULTS, mc: { ...MC_DEFAULTS },
                rt: { value: 'people', period: 'month' }, sg: { metric: 'ltv', cols: 'gm' } };

// ------------------------------------------------------------------ formatting
// Every formatter returns 'n/a' for a missing value (e.g. growth in the first year, quarters without net adds).
const na = v => v == null || !Number.isFinite(v);
const nf = (v, d = 0) => na(v) ? 'n/a' : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const usdB = m => na(m) ? 'n/a' : '$' + nf(m / 1000, 2) + 'B';
const usdM = (v, signed) => na(v) ? 'n/a' : (v < 0 ? '-' : signed ? '+' : '') + '$' + nf(Math.abs(v)) + 'M';
const usd2 = v => na(v) ? 'n/a' : '$' + nf(v, 2);
const pct = (f, d = 1) => na(f) ? 'n/a' : nf(f * 100, d) + '%';
const x1 = v => na(v) ? 'n/a' : nf(v, 1) + 'x';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byYear = (rows, y) => rows.find(r => r.year === y);

// ------------------------------------------------------------------ unit economics (same formulas as the Python model)
function ue(p = state) {
  const b = BASE[p.baseYear], churn = p.churn / 100;
  const netAdds = b.net_adds_m * (1 + p.na / 100);
  const avgSubs = b.avg_subs_m - b.net_adds_m / 2 + netAdds / 2;
  const arpu = b.arpu_usd * (1 + p.arpu / 100), gm = b.gross_margin + p.gm / 100, sm = b.sm_usd_m * (1 + p.sm / 100);
  const gp = arpu * gm, ltv = gp / churn;
  const cacNet = sm / netAdds, cacGross = sm / (netAdds + avgSubs * churn * 12);
  const cac = p.proxy === 'net' ? cacNet : cacGross;
  return { arpu, gm, sm, netAdds, avgSubs, gp, ltv, cacNet, cacGross, cac, ratio: ltv / cac, payback: cac / gp,
           stay: 1 / churn, ratioNet: ltv / cacNet, ratioGross: ltv / cacGross };
}

// ------------------------------------------------------------------ chart + html helpers
function plot(id, traces, layout = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  const base = {
    font: { family: FONT, size: 12, color: '#8a8f98' }, paper_bgcolor: '#fff', plot_bgcolor: '#fff',
    margin: { l: 56, r: 20, t: 52, b: 44 }, hovermode: 'x unified', bargap: 0.3, barcornerradius: 5,
    title: { text: layout.titleText || '', x: 0.015, xanchor: 'left', font: { size: 15, color: '#1d2127', family: FONT } },
    legend: { orientation: 'h', yanchor: 'bottom', y: 1.02, xanchor: 'right', x: 1, font: { color: '#4b5058' } },
    xaxis: { type: 'category', showgrid: false, linecolor: '#e8e8e8', tickfont: { color: '#6b7079' }, automargin: true },
    yaxis: { gridcolor: '#f0f1f4', zerolinecolor: '#d4d7dd', tickfont: { color: '#6b7079' }, automargin: true },
    hoverlabel: { bgcolor: '#1d2127', font: { color: '#fff', family: FONT }, bordercolor: '#1d2127' },
  };
  const merged = { ...base, ...layout, xaxis: { ...base.xaxis, ...(layout.xaxis || {}) },
                   yaxis: { ...base.yaxis, ...(layout.yaxis || {}) }, legend: { ...base.legend, ...(layout.legend || {}) } };
  delete merged.titleText;
  if (state.year !== 'all' && merged.xaxis.type === 'category' && traces[0] && traces[0].x) {
    const hits = traces[0].x.map((v, i) => String(v).includes(String(state.year)) ? i : -1).filter(i => i >= 0);
    if (hits.length) merged.shapes = [...(merged.shapes || []), { type: 'rect', xref: 'x', yref: 'paper',
      x0: Math.min(...hits) - 0.5, x1: Math.max(...hits) + 0.5, y0: 0, y1: 1, fillcolor: 'rgba(29,185,84,0.13)',
      line: { width: 0 }, layer: 'below' }];
  }
  Plotly.newPlot(el, traces, merged, { displayModeBar: false, responsive: true });
}
const bar = (x, y, name, color, fmt = ',.0f', extra = {}) => ({ type: 'bar', x, y, name, marker: { color },
  hovertemplate: `%{y:${fmt}}`, ...extra });
const line = (x, y, name, color, fmt = ',.1f', extra = {}) => ({ type: 'scatter', mode: 'lines+markers', x, y, name,
  line: { width: 3, shape: 'spline', color }, marker: { size: 8, color, line: { width: 2, color: '#fff' } },
  hovertemplate: `%{y:${fmt}}`, ...extra });
const yrs = rows => rows.map(r => String(r.year));
const col = (rows, k, f = v => v) => rows.map(r => r[k] == null ? null : f(r[k]));

function card(label, value, delta, cls) {
  return `<div class="card"><div class="l">${esc(label)}</div><div class="v">${value}</div>` +
         (delta ? `<span class="pill ${cls || ''}">${delta}</span>` : '') + `</div>`;
}
const panel = (id, note, h = 360) => `<div class="panel"><div id="${id}" class="chart" style="height:${h}px"></div>` +
  (note ? `<div class="note">${note}</div>` : '') + `</div>`;
const explain = (h, r) => `<div class="explain"><div class="k">💡 What this means</div><div class="h">${h}</div>` +
  `<div class="r"><b>How to read it:</b> ${r}</div></div>`;
const section = (h, p) => `<div class="section"><h2>${h}</h2>${p ? `<p>${p}</p>` : ''}</div>`;
function table(headers, rows, cls = '') {
  return `<div class="tablewrap"><table class="t ${cls}"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}` +
         `</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function slider(id, label, min, max, step, value, unit, help) {
  return `<div class="ctl"><div class="lab">${label}<span id="${id}-v">${value}${unit}</span></div>` +
         (help ? `<div class="help">${help}</div>` : '') +
         `<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" data-unit="${unit}"></div>`;
}

// ------------------------------------------------------------------ year snapshot (shown when one year is picked)
const KIND = {
  b: [usdB, d => (d < 0 ? '-' : '+') + '$' + nf(Math.abs(d) / 1000, 2) + 'B'],
  m: [v => usdM(v), d => usdM(d, true)],
  pct: [v => pct(v), d => (d >= 0 ? '+' : '') + nf(d * 100, 1) + 'pp'],
  users: [v => nf(v) + 'M', d => (d >= 0 ? '+' : '') + nf(d) + 'M'],
  usd2: [usd2, d => (d < 0 ? '-' : '+') + '$' + nf(Math.abs(d), 2)],
  x: [x1, d => (d >= 0 ? '+' : '') + nf(d, 1) + 'x'],
  mo: [v => nf(v, 1) + ' mo', d => (d >= 0 ? '+' : '') + nf(d, 1) + ' mo'],
};
function snapCard(label, rows, key, kind, better, y) {
  const cur = byYear(rows, y), prev = byYear(rows, y - 1);
  if (!cur || cur[key] == null) return card(label, 'n/a', 'not reported this year');
  const [fv, fd] = KIND[kind];
  if (!prev || prev[key] == null) return card(label, fv(cur[key]), 'first year in the data');
  const d = cur[key] - prev[key];
  const cls = better == null ? '' : ((d >= 0) === better ? 'up' : 'down');

  const body = rowLabels.map((rl, i) => `<tr class="${i === selRow ? 'sel' : ''}"><td>${rl}</td>${values[i].map((v, j) => {

  return `<div class="tablewrap" style="max-height:580px;border:1px solid var(--border);border-radius:10px"><table class="heat"><thead><tr><th style="text-align:left">Monthly churn</th>${colLabels.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>

// Monte Carlo (seeded, so the same settings always give the same answer)
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tri(u, lo, mode, hi) {

  return u < f ? lo + Math.sqrt(u * (hi - lo) * (mode - lo)) : hi - Math.sqrt((1 - u) * (hi - lo) * (hi - mode));
}
function simulate() {
  const m = state.mc, rnd = mulberry32(42), b = BASE[state.baseYear];
  const lo = Math.min(m.lo, m.hi), hi = Math.max(m.lo, m.hi) > lo ? Math.max(m.lo, m.hi) : lo + 0.01;
  const cols = { churn: [], arpu: [], gm: [], sm: [], na: [], ratio: [], ltv: [], cac: [], payback: [], stay: [] };
  for (let i = 0; i < m.runs; i++) {
    const churn = tri(rnd(), lo, (lo + hi) / 2, hi) / 100;
    const arpu = b.arpu_usd * (1 + tri(rnd(), -m.arpu, 0, m.arpu) / 100);
    const gm = b.gross_margin + tri(rnd(), -m.gm, 0, m.gm) / 100;
    const sm = b.sm_usd_m * (1 + tri(rnd(), -m.sm, 0, m.sm) / 100);
    const na = b.net_adds_m * (1 + tri(rnd(), -m.na, 0, m.na) / 100);
    const avg = b.avg_subs_m - b.net_adds_m / 2 + na / 2, gp = arpu * gm, ltv = gp / churn;
    const cac = state.proxy === 'net' ? sm / na : sm / (na + avg * churn * 12);
    cols.churn.push(churn * 100); cols.arpu.push(arpu); cols.gm.push(gm * 100); cols.sm.push(sm); cols.na.push(na);
    cols.ltv.push(ltv); cols.cac.push(cac); cols.ratio.push(ltv / cac); cols.payback.push(cac / gp); cols.stay.push(1 / churn);
  }

}
const quant = (arr, p) => { const s = [...arr].sort((a, b) => a - b), i = (s.length - 1) * p, f = Math.floor(i);

  return da && db ? n / Math.sqrt(da * db) : 0; }

    { titleText: `LTV:CAC across ${nf(n)} simulated futures`, barmode: 'overlay', hovermode: 'closest',

      ['Year', 'Revenue', 'Premium', 'Ads', 'Gross profit', 'Operating income', 'Free cash flow', 'Premium subs', 'MAU', 'Gross margin'],
      yRows.map(r => [r.year, usdM(r.total_rev_usd_m), usdM(r.premium_rev_usd_m), usdM(r.ad_rev_usd_m), usdM(r.gross_profit_usd_m),
        usdM(r.op_income_usd_m), usdM(r.fcf_usd_m), nf(r.premium_subs_m) + 'M', nf(r.mau_m) + 'M', pct(r.gross_margin)]))}</div><br>
    <div class="panel"><h3>Quarterly reported data</h3>${qRows.length ? table(['Quarter', 'Revenue', 'Premium', 'Ads', 'Gross margin', 'Operating margin', 'Net adds', 'ARPU'],
      qRows.map(r => [r.period, usdM(r.total_rev_usd_m), usdM(r.premium_rev_usd_m), usdM(r.ad_rev_usd_m), pct(r.gross_margin), pct(r.op_margin),
        r.premium_net_adds_m == null ? 'n/a' : nf(r.premium_net_adds_m) + 'M', usd2(r.arpu_monthly_usd)])) : `<div class="note">Quarterly figures start in Q4 2024, so there are none for ${state.year}.</div>`}</div>
    <div class="row" style="margin-top:16px"><div class="panel"><h3>Formulas</h3>${table(['Metric', 'Formula'], DATA.formulas.map(f => [esc(f.metric), esc(f.formula)]), 'wrap')}</div>
      <div class="panel"><h3>Glossary</h3>${table(['Term', 'What it means'], DATA.glossary.map(g => [esc(g.term), esc(g.meaning)]), 'wrap')}</div></div>
    <div class="row"><div class="callout warn"><b>Limitations.</b>${esc(DATA.disclaimer)} ARPU is approximated, gross margin is company-level, and LTV is undiscounted.</div></div>`,
  () => {}];
}

// ------------------------------------------------------------------ shared assumption controls + routing
function bindAssumptions(prefix) {
  ['churn', 'arpu', 'gm', 'sm', 'na'].forEach(k => {
    const el = document.getElementById(prefix + k); if (!el) return;
    el.oninput = () => { state[k] = +el.value; document.getElementById(prefix + k + '-v').textContent = el.value + el.dataset.unit;
      updateQuick(); if (state.page === 'ltv') renderLtvOut(); };
    el.onchange = () => { if (state.page === 'assumptions') render(); };
  });
  document.getElementById(prefix + 'proxy').onchange = e => { state.proxy = e.target.value; render(); };
  document.getElementById(prefix + 'baseYear').onchange = e => { state.baseYear = +e.target.value; render(); };
  document.getElementById(prefix + 'reset').onclick = () => { Object.assign(state, DEFAULTS); render(); };
}
function updateQuick() {
  const r = ue(), good = r.ratio >= 3;
  document.getElementById('q-churn').textContent = nf(state.churn, 2) + '%';
  document.getElementById('side-churn').value = state.churn;
  document.getElementById('q-out').innerHTML = `<div class="row2"><span>LTV</span><b>${usd2(r.ltv)}</b></div>
    <div class="row2"><span>LTV:CAC</span><b>${x1(r.ratio)}</b></div>
    <div class="verdict ${good ? 'good' : 'bad'}">${good ? 'Healthy (3x or more)' : 'Weak (below 3x)'}</div>`;
}
const VIEWS = { overview: pageOverview, revenue: pageRevenue, subscribers: pageSubscribers, arpu: pageArpu,
  profitability: pageProfitability, cac: pageCac, ltv: pageLtv, retention: pageRetention, sensitivity: pageSensitivity,
  montecarlo: pageMontecarlo, assumptions: pageAssumptions, data: pageData };
function render() {
  document.getElementById('title').textContent = PAGES[state.page][1];
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.page === state.page));
  const [html, after] = VIEWS[state.page]();
  document.getElementById('view').innerHTML = html;
  after();
  updateQuick();
}
function route() {
  const p = location.hash.replace('#', '');
  state.page = PAGES[p] ? p : 'overview';
  document.getElementById('side').classList.remove('open');
  render(); window.scrollTo(0, 0);
}
document.getElementById('nav').innerHTML = Object.entries(PAGES).map(([k, [label]]) =>
  `<a href="#${k}" data-page="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${label}</a>`).join('');
const yearSel = document.getElementById('year');
YEARS.slice().reverse().forEach(y => yearSel.insertAdjacentHTML('beforeend', `<option value="${y}">${y}</option>`));
yearSel.onchange = () => { state.year = yearSel.value; render(); };
const side = document.getElementById('side-churn');
side.oninput = () => { state.churn = +side.value; updateQuick(); if (state.page === 'ltv') { const a = document.getElementById('a-churn');
  if (a) { a.value = state.churn; document.getElementById('a-churn-v').textContent = state.churn + '%'; } renderLtvOut(); } };
side.onchange = () => { if (['retention', 'sensitivity', 'assumptions', 'montecarlo'].includes(state.page)) render(); };
document.getElementById('burger').onclick = () => document.getElementById('side').classList.toggle('open');
document.getElementById('source').textContent = `Source: Spotify Q4 2025 Shareholder Deck & Form 20-F · ${DATA.checks_pass}/${DATA.checks_total} validation checks passed · amounts in US dollars (ECB average rates)`;
window.addEventListener('hashchange', route);
route();
</script>
</body>
